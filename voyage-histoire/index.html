<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tempo — Mon voyage dans l'Histoire</title>
  <meta name="description" content="Tempo : chaque mois une période de l'Histoire, chaque jour une découverte. Un voyage de 12 mois pour les enfants de 4 à 10 ans.">
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="fond-app">
  <div id="app" aria-live="polite"></div>

  <!-- Formulaire détecté par Netlify Forms : reçoit les abonnements des
       parents au récap mensuel (soumis en JS depuis l'inscription). -->
  <form name="abonnement-tempo" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="abonnement-tempo">
    <input type="text" name="bot-field">
    <input type="email" name="email">
    <input type="text" name="prenom">
    <input type="text" name="debut">
  </form>

  <!-- Données -->
  <script src="js/data/themes.js"></script>
  <script src="js/data/art.js"></script>
  <script src="js/data/card-days.js"></script>
  <script src="js/data/books.js"></script>
  <script src="js/data/activities.js"></script>
  <script src="js/data/places.js"></script>
  <!-- Les 12 mois de cartes « Le savais-tu ? » (31 par thème) -->
  <script src="js/data/facts/commencement.js"></script>
  <script src="js/data/facts/prehistoire.js"></script>
  <script src="js/data/facts/egypte.js"></script>
  <script src="js/data/facts/grece.js"></script>
  <script src="js/data/facts/rome.js"></script>
  <script src="js/data/facts/gaulois.js"></script>
  <script src="js/data/facts/vikings.js"></script>
  <script src="js/data/facts/moyen-age.js"></script>
  <script src="js/data/facts/renaissance.js"></script>
  <script src="js/data/facts/temps-modernes.js"></script>
  <script src="js/data/facts/revolution.js"></script>
  <script src="js/data/facts/notre-epoque.js"></script>
  <!-- Application -->
  <script src="js/storage.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
