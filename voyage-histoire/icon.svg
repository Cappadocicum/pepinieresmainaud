<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".55" stop-color="#db2777"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ballon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#fond)"/>
  <!-- montgolfière : le voyage dans le temps -->
  <g transform="translate(256 210)">
    <ellipse cx="0" cy="0" rx="118" ry="130" fill="url(#ballon)"/>
    <path d="M-118 6 A118 130 0 0 1 118 6 L 60 6 A60 130 0 0 0 -60 6 Z" fill="#ffffff" opacity=".35"/>
    <path d="M-60 6 A60 130 0 0 1 60 6 L 0 6 Z" fill="#dc2626" opacity=".55"/>
    <!-- cadran d'horloge sur le ballon -->
    <circle cx="0" cy="-18" r="52" fill="#fff" opacity=".92"/>
    <circle cx="0" cy="-18" r="52" fill="none" stroke="#7c3aed" stroke-width="8"/>
    <line x1="0" y1="-18" x2="0" y2="-52" stroke="#7c3aed" stroke-width="9" stroke-linecap="round"/>
    <line x1="0" y1="-18" x2="24" y2="-6" stroke="#db2777" stroke-width="9" stroke-linecap="round"/>
    <!-- cordes -->
    <line x1="-80" y1="96" x2="-38" y2="168" stroke="#78350f" stroke-width="8"/>
    <line x1="80" y1="96" x2="38" y2="168" stroke="#78350f" stroke-width="8"/>
  </g>
  <!-- nacelle -->
  <rect x="200" y="372" width="112" height="76" rx="18" fill="#92400e"/>
  <rect x="200" y="372" width="112" height="22" rx="11" fill="#b45309"/>
  <!-- étoiles -->
  <circle cx="92" cy="108" r="10" fill="#fff" opacity=".9"/>
  <circle cx="430" cy="86" r="7" fill="#fff" opacity=".8"/>
  <circle cx="440" cy="330" r="9" fill="#fff" opacity=".7"/>
  <circle cx="70" cy="320" r="6" fill="#fff" opacity=".7"/>
</svg>
