# Configuration Netlify — site statique (aucun build nécessaire).
[build]
  publish = "."
  command = ""

# Le micro et l'audio nécessitent un contexte sécurisé : Netlify sert en HTTPS,
# donc l'enregistrement et l'installation PWA fonctionnent directement.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
